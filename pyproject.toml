[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowops"
version = "0.1.0"
description = "Deterministic process discovery over synthetic company activity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shadowops = "shadowops.cli:main"

[tool.setuptools.packages.find]
include = ["shadowops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

